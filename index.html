
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ピアノコード学習アプリ</title>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>

 <main class="app-container"> 

<div class="piano-scroll">

<div class="piano">
    <div class="key white" id="key-c4" data-note="C" data-octave="4">
        ド
        <div class="key black" data-note="C#" data-octave="4">ド#</div>
    </div>
    <div class="key white" data-note="D" data-octave="4">
        レ
        <div class="key black" data-note="D#" data-octave="4">レ#</div>
    </div>
    <div class="key white" data-note="E" data-octave="4">ミ</div>
    <div class="key white" data-note="F" data-octave="4">
        ファ
        <div class="key black" data-note="F#" data-octave="4">ファ#</div>
    </div>
    <div class="key white" data-note="G" data-octave="4">
        ソ
        <div class="key black" data-note="G#" data-octave="4">ソ#</div>
    </div>
    <div class="key white" data-note="A" data-octave="4">
        ラ
        <div class="key black" data-note="A#" data-octave="4">ラ#</div>
    </div>
    <div class="key white" data-note="B" data-octave="4">シ</div>

    
    <div class="key white" id="key-c5" data-note="C" data-octave="5">
        ド
        <div class="key black" data-note="C#" data-octave="5">ド#</div>
    </div>
    <div class="key white" data-note="D" data-octave="5">
        レ
        <div class="key black" data-note="D#" data-octave="5">レ#</div>
    </div>
    <div class="key white" data-note="E" data-octave="5">ミ</div>
    <div class="key white" data-note="F" data-octave="5">
        ファ
        <div class="key black" data-note="F#" data-octave="5">ファ#</div>
    </div>
    <div class="key white" data-note="G" data-octave="5">
        ソ
        <div class="key black" data-note="G#" data-octave="5">ソ#</div>
    </div>
    <div class="key white" data-note="A" data-octave="5">
        ラ
        <div class="key black" data-note="A#" data-octave="5">ラ#</div>
    </div>
    <div class="key white" data-note="B" data-octave="5">シ</div>
</div>

</div>

<div class="result-card">
    <div class="result-label">DETECTED CHORD</div>
    <p id="chord-result">コードを選択してください</p>
</div>



</main>  

<script src="script.js"></script>
</body>

</html>
